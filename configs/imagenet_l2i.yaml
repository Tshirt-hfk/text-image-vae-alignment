model:
  name: "alignment_vae"
  input_size: 256                       # Input image resolution
  latent_dim: 64                        # Latent channel dim D (spatial: [B, H//16, W//16, D])
  image_channels: 3

  # Flux2-style VAE config
  vae_variant: "VAE-H"                  # VAE-B | VAE-L | VAE-H
  ch: 128                               # Base channel width (used if vae_variant is custom)
  ch_mult: [1, 2, 4, 4]                 # Channel multipliers → [128, 256, 512, 512]
  num_res_blocks: 2                     # ResBlocks per stage (encoder: 2, decoder: 3)
  attn_resolutions: [16]                # Self-attention at 16x16 resolution
  double_z: true                        # Encoder outputs 2*D channels for (mu, logsigma)

  # ── 条件编码器 ───────────────────────────────────────────
  # cond_type:
  #   'label' (默认) → EmbeddingLabelEncoder
  #                    （nn.Embedding 直接把 label 映射为 [h, w, latent_dim] 高斯）
  #   'text'         → TextEncoderWrapper + SpatialTextEncoder (T2I, 见 coco_t2i.yaml)
  cond_type: "label"
  num_classes: 1000                     # ImageNet classes

  # Initial log(σ) for label-side Gaussian heads.
  #   -2.0 → σ≈0.135
  #   -1.0 → σ≈0.368
  #   -0.5 → σ≈0.607
  #    0.0 → σ≈1.000   
  label_init_logsigma: -2.0

training:
  # Per-GPU batch size. Effective batch = batch_size * accum_iter * num_gpus
  batch_size: 16
  accum_iter: 4                         # Gradient accumulation steps (increase to simulate larger batch)
  num_workers: 8
  epochs: 100

  # Learning rate (absolute, for VAE branch)
  lr: 1.0e-4
  lr_label_encoder: 1.0e-4              # Separate LR for label encoder (scaled via lr_scale)

  # LR schedule
  lr_schedule: "constant"                 # cosine | constant
  warmup_epochs: 5
  min_lr: 0.0

  # Loss weights (alignment uses mean reduction)
  weight_recon: 1.0
  weight_alignment: 1.0                 # KL(q_img || q_label) — forward alignment (diversity-preserving)
  weight_alignment_reverse: 0.1         # KL(q_label || q_img) — stabilize μ alignment, prevent σ overshoot

  # Gaussian alignment temperature
  alignment_temp: 1.0

  # Gradient clipping
  grad_clip: 1.0

  # Performance optimization
  use_amp: true                          # AMP mixed-precision training
  use_compile: false                     # torch.compile (PyTorch 2.0+, set true to enable kernel fusion)

  # Logging and checkpointing
  log_interval: 100                     # Print & tensorboard log every N steps
  save_interval: 10                     # Save checkpoint every N epochs

  # Dataset (ImageNet with class labels)
  # Expected layout: data_root/{train, val}/<class_name>/*.jpg
  dataset: "imagenet"                   # imagenet | dummy
  data_root: "/mnt/tidalfs-bdsz01/dataset/aigc-data/data/imagenet"
  num_classes: 1000

  # Evaluation
  compute_fid: true                     # Compute FID for label→image generation
  fid_num_samples: 10000                # Number of samples for FID computation

optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  type: "cosine"
  warmup_type: "linear"

logging:
  level: "INFO"
  log_file: "./logs/training.log"
  use_tensorboard: true
  tensorboard_dir: "./logs/tensorboard"
  use_wandb: false
  wandb_project: "spatial-alignment-vae"

# ============================================================================
# Distributed training config
# ============================================================================
# Launch command examples:
#
#   Single GPU:
#     python train.py --config configs/imagenet_l2i.yaml
#
#   8 GPUs on one machine, with base LR scaling:
#     torchrun --nproc_per_node=8 train.py --config configs/imagenet_l2i.yaml
#
#   Resume from checkpoint:
#     torchrun --nproc_per_node=8 train.py --config configs/imagenet_l2i.yaml --resume ./output_dir
